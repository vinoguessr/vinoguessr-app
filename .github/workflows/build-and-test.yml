name: Build and test
on:
  # Not on pushes to codex/** branches: every PR commit would run the macOS jobs twice.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new PR commit cancels the PR's superseded run. Other runs get a group per commit: a shared group
  # keeps only one pending run, so back-to-back merges to main would otherwise skip commits.
  group: build-and-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # VinoGuessrKit requires the iOS 27 SDK, which only the xcode-27 runner image ships. Name the Xcode
  # release instead of using the image default, so an image update cannot change the toolchain unnoticed.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
defaults:
  run:
    # An explicit bash shell runs with -o pipefail, so piping into xcbeautify keeps xcodebuild's exit status.
    shell: bash
jobs:
  test-kit:
    name: Test VinoGuessrKit (iOS Simulator)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the selected Xcode
        run: xcodebuild -version
      # The live API suites are skipped here: they run only with VINOGUESSR_LIVE_API_TESTS=1
      # (Tests/APITests/LiveAPITrait.swift). xcodebuild cannot approve package macros interactively,
      # so -skipMacroValidation trusts the macro packages pinned in Package.resolved. The output is not
      # piped into xcbeautify, which left out some Swift Testing result lines and the "Test run with
      # N tests" summary, so the log would under-report what ran.
      - name: Test
        working-directory: VinoGuessrKit
        run: |
          xcodebuild test \
            -scheme VinoGuessrKit \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation
  build-app:
    name: Build VinoGuessr (iOS Simulator)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show the selected Xcode
        run: xcodebuild -version
      # Without a Package.resolved of its own, the project falls back to VinoGuessrKit/Package.resolved
      # (observed Xcode behavior, not documented; the Build step fails if a future Xcode stops doing it),
      # so the app and test-kit build the same pinned versions. A project-level file would take precedence
      # for the app build, and Dependabot would not update it, so the two could drift apart.
      - name: Check that the app uses VinoGuessrKit/Package.resolved
        run: |
          resolved=VinoGuessr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ -e "$resolved" ]; then
            echo "::error file=$resolved::Remove $resolved: VinoGuessrKit/Package.resolved pins the app's packages, so add dependencies to VinoGuessrKit/Package.swift."
            exit 1
          fi
      # -onlyUsePackageVersionsFromResolvedFile fails instead of resolving when VinoGuessrKit/Package.resolved
      # is out of date, so -skipMacroValidation trusts only the macro packages pinned there, as in test-kit.
      - name: Build
        run: |
          xcodebuild build \
            -project VinoGuessr.xcodeproj \
            -scheme VinoGuessr \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
